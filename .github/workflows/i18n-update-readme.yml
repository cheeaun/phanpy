name: Update README with list of i18n volunteers

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/i18n-update-readme.yml'
  schedule:
    # Every week
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-readme:
    if: github.repository == 'cheeaun/phanpy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: andrii-bodnar/action-crowdin-contributors@v3
        with:
          max_contributors: 100
          image_size: 50
          include_languages: true
          excluded_users: cheeaun
          crowdin_project_link: 'https://crowdin.com/project/phanpy'
          placeholder_start: '<!-- i18n volunteers start -->'
          placeholder_end: '<!-- i18n volunteers end -->'
        env:
          CROWDIN_PROJECT_ID: '703337'
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_ACCESS_TOKEN }}
      - run: |
          # Commit & push if there are changes
          if git diff --quiet README.md; then
            echo "No changes to README.md"
          else
            echo "Changes to README.md"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git config --global user.name "github-actions[bot]"
            git add README.md
            git commit -m "Update README.md"
            git push
          fi
